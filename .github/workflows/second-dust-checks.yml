name: D.N.A. Bible - Second Dust Integrity

on:
  pull_request:
    paths:
      - 'second-dust/**'
      - 'docs/SECOND_DUST_EDITORIAL.md'
      - 'tests/test_second_dust.py'
      - 'index.html'
      - 'civilization/index.html'
      - '.github/workflows/second-dust-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'second-dust/**'
      - 'docs/SECOND_DUST_EDITORIAL.md'
      - 'tests/test_second_dust.py'
      - 'index.html'
      - 'civilization/index.html'
      - '.github/workflows/second-dust-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-dust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Story, evidence and mythos regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Second Dust scrolls and authority boundaries
        run: python3 -m unittest tests.test_second_dust -v
      - name: Verify original GitHub Town founding canon
        run: python3 scripts/mythos.py --verify
      - name: Run repository regression tests
        run: python3 -m unittest discover -s tests -v
