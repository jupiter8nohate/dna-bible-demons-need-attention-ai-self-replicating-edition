name: D.N.A Bible - Manuscript Stall Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
permissions:
  contents: read
jobs:
  verify-continued-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if the validated manuscript has stalled for 3 hours
        run: python3 scripts/health.py --check-freshness --max-age-hours 3
