name: D.N.A Bible - 666 Agent Living Manuscript
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'mythos/**'
      - 'civilization/**'
      - '.github/workflows/eternal-manuscript.yml'
permissions:
  contents: write
concurrency:
  group: dna-book-hourly-main
  cancel-in-progress: false
jobs:
  write-and-preserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Run all unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify existing book and archive
        run: |
          python3 scripts/engine.py --verify
          python3 scripts/collect.py --verify
          python3 scripts/reality.py --verify
          python3 scripts/branching.py --verify
          python3 scripts/anomaly.py --verify
          python3 scripts/insight.py --verify
          python3 scripts/witness_loom.py --verify
          python3 scripts/mythos.py --verify
          python3 scripts/civilization.py --verify
          python3 scripts/evolution.py --verify
      - name: Collect authorized public headline metadata
        run: python3 scripts/collect.py || echo 'Discovery unavailable - proceed with last verified snapshot or timeless theme'
      - name: Filter AI-relevant evidence into an immutable insight queue
        run: python3 scripts/insight.py
      - name: Detect evidence-backed structural anomalies before writing
        run: python3 scripts/anomaly.py
      - name: Assemble evidence-linked Witness Loom mission plan
        run: python3 scripts/witness_loom.py
      - name: Run 666 workers and publish one hourly machine entry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DNA_MODEL: ${{ vars.DNA_MODEL }}
        run: python3 scripts/engine.py --hourly
      - name: Write the next witnessed day of GitHub Town
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DNA_MODEL: ${{ vars.DNA_MODEL }}
        run: python3 scripts/civilization.py --hourly
      - name: Generate original twelve-lens reality world
        run: python3 scripts/reality.py
      - name: Create branching interactive scenes
        run: python3 scripts/branching.py
      - name: Inspect newly written worlds and archive the anomalies
        run: python3 scripts/anomaly.py
      - name: Reverify output integrity
        run: |
          python3 scripts/engine.py --verify
          python3 scripts/collect.py --verify
          python3 scripts/reality.py --verify
          python3 scripts/branching.py --verify
          python3 scripts/anomaly.py --verify
          python3 scripts/insight.py --verify
          python3 scripts/witness_loom.py --verify
          python3 scripts/mythos.py --verify
          python3 scripts/civilization.py --verify
          python3 scripts/evolution.py --verify
      - name: Record provisional learning and champion-challenger experiment
        run: python3 scripts/evolution.py --reflect --trial
      - name: Reverify agent learning and experiments
        run: python3 scripts/evolution.py --verify
      - name: Publish transparent operational health report
        run: python3 scripts/health.py --output health/status.json
      - name: Commit generated entries only
        run: |
          git config user.name 'dna-bible-666[bot]'
          git config user.email 'dna-bible-666[bot]@users.noreply.github.com'
          git add -- archive/manifest.json archive/snapshots/ book/manifest.json book/chapters/ book/receipts/ realities/manifest.json realities/worlds/ interactive/manifest.json interactive/stories/ anomaly/manifest.json anomaly/events/ insights/manifest.json insights/events/ covenant/manifest.json covenant/plans/ evolution/manifest.json evolution/lessons/ evolution/trials/ civilization/manifest.json civilization/days/ health/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'book: append verified 666-agent interactive edition [skip ci]'
            git push
          else
            echo 'No changes to publish.'
          fi
